{% extends 'shop/base.html' %}

{% block content %}
<div class="row justify-content-center mb-5">
    <div class="col-md-8">
        <form method="GET" action="{% url 'product_list' %}" class="card p-4 shadow-sm">
            <div class="input-group">
                <input type="text" name="q" class="form-control me-2" placeholder="Пошук аксесуарів..." value="{{ query|default:'' }}">
                <button type="submit" class="btn btn-primary">Знайти</button>
            </div>
            <div class="form-check form-switch mt-3">
                <input class="form-check-input" type="checkbox" name="use_smart" id="smartSearch"
                       {% if use_smart %}checked{% endif %}>
                <label class="form-check-label" for="smartSearch">
                    Увімкнути <strong>Smart Search</strong> (враховувати контекст та ціну)
                </label>
            </div>
        </form>
    </div>
</div>
<h1 class="text-center mb-4">Каталог Аксесуарів</h1>
<div class="row row-cols-1 row-cols-md-3 g-4">
    {% for product in products %}
    <div class="col">
        <div class="card h-100 shadow-sm">
            <img src="{{ product.thumbnail }}" class="card-img-top p-3" style="height: 250px; object-fit: contain;">
            <div class="card-body">
                <h5 class="card-title">{{ product.title }}</h5>
                <h6 class="text-success">${{ product.price }}</h6>
            </div>
            <div class="card-footer bg-white border-top-0">
                {% if product.id in cart_product_ids %}
                    <button class="btn btn-secondary w-100" disabled>Вже в корзині</button>
                {% else %}
                    <a href="{% url 'add_to_cart' product.id %}" class="btn btn-outline-primary w-100">Додати в корзину</a>
                {% endif %}
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
